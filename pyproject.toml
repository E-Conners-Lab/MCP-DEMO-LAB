[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-mcp"
version = "1.0.0"
description = "MCP server for network device automation — give AI direct access to your network"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "E-Conners-Lab"},
]
keywords = ["mcp", "network", "automation", "cisco", "netmiko", "ai", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "mcp>=1.0.0",
    "netmiko>=4.0.0",
    "ncclient>=0.6.0",
    "scrapli[asyncssh]>=2024.0.0",
    "ntc-templates>=8.0.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "defusedxml>=0.7.1",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
snmp = ["pysnmp>=6.0.0"]
netbox = ["pynetbox>=7.0.0"]
pyats = ["pyats>=24.0", "genie>=24.0"]
nornir = ["nornir>=3.4.0", "nornir-scrapli>=2024.0.0", "nornir-netmiko>=1.0.0"]
all = [
    "network-mcp[snmp,netbox,pyats,nornir]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/econners/network-mcp"
Documentation = "https://github.com/econners/network-mcp/tree/main/docs"
Issues = "https://github.com/econners/network-mcp/issues"

[project.scripts]
network-mcp = "network_mcp_server:main"

[tool.setuptools.packages.find]
include = ["mcp_tools*", "core*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"